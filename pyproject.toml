[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-rag"
version = "0.1.0"
description = "Evidence-grounded literature assistant for stochastic computing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
hybrid = [
  "huggingface-hub>=0.34,<1",
  "numpy>=1.26",
  "sentence-transformers>=3.4,<4",
  "transformers>=4.41,<5",
]
ui = ["streamlit>=1.36"]

[project.scripts]
sc-rag-ingest = "sc_rag.ingest:main"
sc-rag-search = "sc_rag.search:main"
sc-rag-dense-search = "sc_rag.dense:main"
sc-rag-hybrid-search = "sc_rag.hybrid:main"
sc-rag-answer = "sc_rag.answering:main"
sc-rag-review = "sc_rag.literature_review:main"

[tool.setuptools.packages.find]
where = ["src"]


