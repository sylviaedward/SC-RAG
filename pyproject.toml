[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-rag"
version = "0.1.0"
description = "Evidence-grounded literature assistant for stochastic computing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sc-rag-ingest = "sc_rag.ingest:main"
sc-rag-search = "sc_rag.search:main"

[tool.setuptools.packages.find]
where = ["src"]


